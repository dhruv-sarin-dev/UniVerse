# Render Blueprint Specification for Uni-Verse
# One-click deployment of the whole stack (FastAPI backend + React frontend).
services:
  # Backend API (FastAPI)
  - type: web
    name: uni-verse-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    secretFiles:
      - key: service-account.json
        path: /etc/secrets/service-account.json
    envVars:
      - key: GROQ_API_KEY
        sync: false
        description: "API Key for Groq Llama3 modeling"
      - key: GITHUB_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: PYTHON_VERSION
        value: "3.10.0"
      # Leave this false until a frontend build that sends the Firebase ID
      # token is live, then flip it. Turning it on first locks every write
      # endpoint against the deployed app.
      - key: REQUIRE_AUTH
        value: "false"
      # Comma-separated. Defaults to * — set this to the real frontend origin
      # once the URL is known.
      - key: ALLOWED_ORIGINS
        sync: false
        description: "e.g. https://uni-verse.vercel.app"

  # Frontend (React/Vite)
  - type: static
    name: uni-verse-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    envVars:
      # `property: host` yields a bare hostname with no scheme. src/api.js
      # normalises that to https:// — without it, fetch builds a relative URL
      # and `new WebSocket()` throws outright, taking the War Room down.
      - key: VITE_API_URL
        fromService:
          type: web
          name: uni-verse-backend
          property: host
      # Vite inlines these at build time, so they must exist here or the
      # deployed bundle ships with an unconfigured Firebase and silently
      # falls back to the mock login path.
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      # Optional. Without a TURN relay, calls fail whenever either peer sits
      # behind a symmetric NAT (most mobile data, many campus networks).
      - key: VITE_TURN_URL
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
